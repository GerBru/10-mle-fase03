[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn"
version = "0.1.0"
description = "Telco Customer Churn Prediction — FIAP 10MLET Tech Challenge"
requires-python = ">=3.10"
dependencies = [
    # Deep Learning
    "torch>=2.0.0,<2.3.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # ML / Data
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26,<2.0.0",
    "imbalanced-learn>=0.12",
    "joblib>=1.3",
    "scipy>=1.12",
    # Experiment tracking
    "mlflow>=2.10",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "openpyxl>=3.1",
    # Data validation
    "pandera>=0.18",
    # Utilities
    "python-dotenv>=1.0",
    "loguru>=0.7",
    # Visualização
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=4.0.1",
    "prometheus-client>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"notebooks/*" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]

[tool.uv]
# torch-backend is not a valid uv field; CPU-only torch is handled via
# the sys_platform conditional in [project.dependencies]